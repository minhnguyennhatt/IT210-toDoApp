<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title th:text="#{app.title}">Todo App</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">

<div class="container">
    <div class="row justify-content-center align-items-center min-vh-100">
        <div class="col-sm-8 col-md-5 col-lg-4">

            <div class="card shadow-sm">
                <div class="card-body text-center p-4">

                    <h3 class="card-title mb-1" th:text="#{app.title}">Todo App</h3>
                    <p class="text-muted mb-4" th:text="#{login.title}">Enter your name</p>

                    <!-- Error message -->
                    <div class="alert alert-danger py-2" th:if="${error}" th:text="${error}"></div>

                    <!-- Login form -->
                    <form th:action="@{/login}" method="post">
                        <div class="mb-3">
                            <input type="text" name="ownerName" class="form-control form-control-lg"
                                   th:placeholder="#{login.placeholder}" required autofocus/>
                        </div>
                        <button type="submit" class="btn btn-primary w-100 btn-lg" th:text="#{login.submit}">
                            Start
                        </button>
                    </form>

                    <!-- Language switch -->
                    <div class="mt-3">
                        <a th:href="@{/login(lang='vi')}" class="btn btn-outline-secondary btn-sm me-1">
                            🇻🇳 Tiếng Việt
                        </a>
                        <a th:href="@{/login(lang='en')}" class="btn btn-outline-secondary btn-sm">
                            🇬🇧 English
                        </a>
                    </div>

                </div>
            </div>

        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
