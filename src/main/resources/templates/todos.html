<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title th:text="#{app.title}">Todo App</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        .status-PENDING { background: #fff3cd; color: #856404; }
        .status-DONE { background: #d4edda; color: #155724; }
        .status-IN_PROGRESS { background: #cce5ff; color: #004085; }
        .priority-HIGH { color: #dc3545; font-weight: bold; }
        .priority-MEDIUM { color: #fd7e14; font-weight: bold; }
        .priority-LOW { color: #198754; font-weight: bold; }
    </style>
</head>
<body class="bg-light">

<div class="container py-4" style="max-width: 960px;">

    <!-- Top bar -->
    <div class="d-flex justify-content-between align-items-center bg-white rounded shadow-sm p-3 mb-3">
        <div class="fw-semibold fs-5">
            <span th:text="#{app.welcome}">Welcome</span>,
            <span class="text-primary" th:text="${ownerName}">Owner</span>!
        </div>
        <div class="d-flex align-items-center gap-2">
            <a th:href="@{/(lang='vi')}" class="btn btn-outline-secondary btn-sm">🇻🇳 VI</a>
            <a th:href="@{/(lang='en')}" class="btn btn-outline-secondary btn-sm">🇬🇧 EN</a>
            <a th:href="@{/logout}" class="btn btn-outline-danger btn-sm" th:text="#{nav.logout}">Logout</a>
        </div>
    </div>

    <!-- Flash message -->
    <div class="alert alert-success" th:if="${message}" th:text="${message}"></div>

    <!-- Todo list -->
    <h4 class="border-bottom border-primary pb-2 mb-3" th:text="#{todo.list.title}">Todo List</h4>

    <div class="table-responsive mb-4">
        <table class="table table-bordered table-hover bg-white shadow-sm mb-0">
            <thead class="table-primary">
            <tr>
                <th th:text="#{todo.id}">ID</th>
                <th th:text="#{todo.content}">Content</th>
                <th th:text="#{todo.dueDate}">Due Date</th>
                <th th:text="#{todo.status}">Status</th>
                <th th:text="#{todo.priority}">Priority</th>
                <th th:text="#{todo.action}">Actions</th>
            </tr>
            </thead>
            <tbody>
            <tr th:each="t : ${todos}">
                <td th:text="${t.id}"></td>
                <td th:text="${t.content}"></td>
                <td th:text="${t.dueDate}"></td>
                <td>
                    <span th:classappend="'status-' + ${t.status}" class="badge rounded-pill">
                        <span th:switch="${t.status}">
                            <span th:case="PENDING" th:text="#{status.PENDING}"></span>
                            <span th:case="IN_PROGRESS" th:text="#{status.IN_PROGRESS}"></span>
                            <span th:case="DONE" th:text="#{status.DONE}"></span>
                            <span th:case="*" th:text="${t.status}"></span>
                        </span>
                    </span>
                </td>
                <td>
                    <span th:classappend="'priority-' + ${t.priority}">
                        <span th:switch="${t.priority}">
                            <span th:case="LOW" th:text="#{priority.LOW}"></span>
                            <span th:case="MEDIUM" th:text="#{priority.MEDIUM}"></span>
                            <span th:case="HIGH" th:text="#{priority.HIGH}"></span>
                            <span th:case="*" th:text="${t.priority}"></span>
                        </span>
                    </span>
                </td>
                <td>
                    <div class="d-flex gap-1">
                        <a th:href="@{/edit/{id}(id=${t.id})}" class="btn btn-warning btn-sm" th:text="#{todo.edit}">Edit</a>
                        <a th:href="@{/delete/{id}(id=${t.id})}" class="btn btn-danger btn-sm"
                           th:attr="onclick='return confirm(\'' + #{confirm.delete} + '\)'"
                           th:text="#{todo.delete}">Delete</a>
                    </div>
                </td>
            </tr>
            <tr th:if="${#lists.isEmpty(todos)}">
                <td colspan="6" class="text-center text-muted" th:text="#{todo.empty}">No tasks yet.</td>
            </tr>
            </tbody>
        </table>
    </div>

    <!-- Form: Add or Edit -->
    <h4 th:if="${todo.id == null}" class="border-bottom border-primary pb-2 mb-3" th:text="#{todo.add.title}">Add New</h4>
    <h4 th:if="${todo.id != null}" class="border-bottom border-primary pb-2 mb-3" th:text="#{todo.edit.title(${todo.id})}">Edit Task</h4>

    <div class="card shadow-sm mb-4">
        <div class="card-body">

            <!-- Add form -->
            <form th:if="${todo.id == null}" th:action="@{/add}" th:object="${todo}" method="post">

                <div class="row g-3 mb-3">
                    <div class="col-md-7">
                        <label class="form-label" th:text="#{todo.add.content}">Content</label>
                        <input type="text" th:field="*{content}" class="form-control" th:placeholder="#{todo.add.content.placeholder}"/>
                        <div class="text-danger small" th:errors="*{content}"></div>
                    </div>
                    <div class="col-md-5">
                        <label class="form-label" th:text="#{todo.add.dueDate}">Due Date</label>
                        <input type="date" th:field="*{dueDate}" class="form-control"/>
                        <div class="text-danger small" th:errors="*{dueDate}"></div>
                    </div>
                </div>

                <div class="row g-3 mb-3">
                    <div class="col-md-6">
                        <label class="form-label" th:text="#{todo.add.status}">Status</label>
                        <select th:field="*{status}" class="form-select">
                            <option value="PENDING" th:text="#{status.PENDING}">Pending</option>
                            <option value="IN_PROGRESS" th:text="#{status.IN_PROGRESS}">In Progress</option>
                            <option value="DONE" th:text="#{status.DONE}">Done</option>
                        </select>
                    </div>
                    <div class="col-md-6">
                        <label class="form-label" th:text="#{todo.add.priority}">Priority</label>
                        <select th:field="*{priority}" class="form-select">
                            <option value="LOW" th:text="#{priority.LOW}">Low</option>
                            <option value="MEDIUM" th:text="#{priority.MEDIUM}">Medium</option>
                            <option value="HIGH" th:text="#{priority.HIGH}">High</option>
                        </select>
                    </div>
                </div>

                <button type="submit" class="btn btn-primary" th:text="#{todo.add.submit}">Add</button>
            </form>

            <!-- Edit form -->
            <form th:if="${todo.id != null}" th:action="@{/update}" th:object="${todo}" method="post">
                <input type="hidden" th:field="*{id}"/>

                <div class="row g-3 mb-3">
                    <div class="col-md-7">
                        <label class="form-label" th:text="#{todo.add.content}">Content</label>
                        <input type="text" th:field="*{content}" class="form-control" th:placeholder="#{todo.add.content.placeholder}"/>
                        <div class="text-danger small" th:errors="*{content}"></div>
                    </div>
                    <div class="col-md-5">
                        <label class="form-label" th:text="#{todo.add.dueDate}">Due Date</label>
                        <input type="date" th:field="*{dueDate}" class="form-control"/>
                        <div class="text-danger small" th:errors="*{dueDate}"></div>
                    </div>
                </div>

                <div class="row g-3 mb-3">
                    <div class="col-md-6">
                        <label class="form-label" th:text="#{todo.add.status}">Status</label>
                        <select th:field="*{status}" class="form-select">
                            <option value="PENDING" th:text="#{status.PENDING}">Pending</option>
                            <option value="IN_PROGRESS" th:text="#{status.IN_PROGRESS}">In Progress</option>
                            <option value="DONE" th:text="#{status.DONE}">Done</option>
                        </select>
                    </div>
                    <div class="col-md-6">
                        <label class="form-label" th:text="#{todo.add.priority}">Priority</label>
                        <select th:field="*{priority}" class="form-select">
                            <option value="LOW" th:text="#{priority.LOW}">Low</option>
                            <option value="MEDIUM" th:text="#{priority.MEDIUM}">Medium</option>
                            <option value="HIGH" th:text="#{priority.HIGH}">High</option>
                        </select>
                    </div>
                </div>

                <div class="d-flex gap-2">
                    <button type="submit" class="btn btn-primary" th:text="#{todo.edit.submit}">Update</button>
                    <a th:href="@{/}" class="btn btn-secondary" th:text="#{todo.edit.cancel}">Cancel</a>
                </div>
            </form>

        </div>
    </div>

</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
